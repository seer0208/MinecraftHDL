name: invalid_anchor
version: "0.1"
cells:
  - name: bad_or
    kind: OR
    size: [3, 1, 4]
    pins:
      - name: A
        direction: input
        anchor: [0, 0, 0]
        side: west
      - name: B
        direction: input
        anchor: [5, 0, 0]
        side: east
      - name: Y
        direction: output
        anchor: [1, 0, 3]
        side: south
    orientations: [north]
    delay_ticks: 1
    max_wire_without_repeater: 15
