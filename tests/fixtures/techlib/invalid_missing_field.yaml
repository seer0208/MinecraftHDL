name: invalid_missing_field
version: "0.1"
cells:
  - name: bad_and
    kind: AND
    size: [3, 2, 4]
    pins:
      - name: A
        direction: input
        anchor: [0, 0, 0]
        side: west
      - name: B
        direction: input
        anchor: [2, 0, 0]
        side: east
      - name: Y
        direction: output
        anchor: [1, 0, 3]
        side: south
    orientations: [north]
    max_wire_without_repeater: 15
